title: Virtual AI Patient Docs
description: Product, architecture, and technical documentation for the Virtual AI Patient project.
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

url: "https://virtual-ai-patient.github.io"
baseurl: "/platform"

color_scheme: light

nav_enabled: true

mermaid:
  version: "11"

aux_links:
  "GitHub repository":
    - "https://github.com/virtual-ai-patient/platform"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - "project management/epic-analytics-export"
  - "project management/epic-rest-api"
  - "project management/epic-safety"
  - "project management/feature-communication-evaluation"
  - "project management/feature-persistent-sessions"
  - "project management/pivot-startup-proposal"
